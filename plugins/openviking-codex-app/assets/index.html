body:has(#explorer) main{max-width:none;padding:16px 20px}body:has(#explorer) .tabs{margin-bottom:12px}
.explorer-toolbar{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px}.explorer-toolbar>button{padding:6px;display:flex}.explorer-toolbar .path{flex:1;margin:0}.uri-form{display:flex;gap:8px;margin:10px 0}.uri-form button{flex-shrink:0;white-space:nowrap;padding:5px 12px}.uri-form input{min-width:0;font:12px ui-monospace,monospace;padding:7px 10px}
.explorer-layout{display:grid;grid-template-columns:minmax(220px,28%) minmax(0,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden;height:calc(100dvh - 255px);min-height:400px}.tree-pane{min-width:0;overflow:auto;border-right:1px solid var(--line);background:var(--bg)}.pane-title{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);position:sticky;top:0;background:var(--bg);z-index:1}.pane-title label{display:flex;align-items:center;gap:4px;margin:0;font-size:11px}.pane-title input{width:auto;margin:0}#tree{padding:8px 0}.tree-row{display:flex;align-items:center;min-height:32px;min-width:0;padding-right:6px}.tree-row:hover{background:var(--soft)}.tree-toggle{display:flex;align-items:center;justify-content:center;border:0;background:transparent;border-radius:4px;padding:2px;flex:none;width:22px;height:26px;color:var(--muted)}.tree-spacer{flex:none;width:22px}.tree-entry{display:flex;align-items:center;gap:7px;min-width:0;flex:1;border:0;background:transparent;text-align:left;padding:4px 0;border-radius:0;font-size:12px;white-space:nowrap}.tree-entry:hover{background:transparent}.tree-entry svg{flex:none;color:var(--muted)}.tree-entry span{overflow:hidden;text-overflow:ellipsis}.selected{background:color-mix(in srgb,var(--accent) 10%,var(--bg))!important;color:var(--accent)}.tree-status{padding:5px 16px 5px 38px;color:var(--muted);font-size:11px;overflow-wrap:anywhere}
.explorer-layout .preview{padding:0;min-width:0;max-height:none;overflow:auto}.preview-heading{padding:14px 18px;border-bottom:1px solid var(--line)}.preview-heading h2{display:flex;align-items:center;gap:8px;font-size:14px;margin:0;overflow-wrap:anywhere}.preview-heading svg{flex:none;color:var(--muted)}.preview-tabs{display:flex;gap:4px;padding:0 14px;border-bottom:1px solid var(--line)}.preview-tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;font-size:12px;padding:9px 10px;color:var(--muted)}.preview-tabs button[aria-selected=true]{border-bottom-color:var(--accent);color:var(--text)}.level-tabs{gap:14px}.level-tabs button{font-size:13px}.level-tabs span{font:10px ui-monospace,monospace;margin-left:5px;color:var(--muted);background:var(--soft);padding:2px 4px;border-radius:3px}.view-tabs{padding-top:5px;padding-bottom:5px;gap:4px;background:var(--soft)}.view-tabs button{padding:3px 10px;border:0;border-radius:5px}.view-tabs button[aria-selected=true]{background:var(--bg);box-shadow:0 1px 2px #0001}.preview-content{padding:20px}.preview-content pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.75 ui-monospace,monospace}.path-view{display:grid;gap:16px;justify-items:start}.path-view code{overflow-wrap:anywhere;font-size:12px}.path-view button{font-size:12px;padding:5px 10px}
.markdown-body{font-size:13px;line-height:1.85;overflow-wrap:anywhere}.markdown-body h1{font-size:23px}.markdown-body h2{font-size:19px;margin:20px 0 10px}.markdown-body h3{font-size:16px}.markdown-body table{border-collapse:collapse;display:block;overflow:auto}.markdown-body td,.markdown-body th{border:1px solid var(--line);padding:5px 9px}.markdown-body pre{padding:12px;background:var(--soft);border-radius:6px;overflow:auto}.markdown-body code{font-size:12px}.markdown-body blockquote{border-left:3px solid var(--accent);padding-left:12px;margin-left:0;color:var(--muted)}.markdown-body a{color:var(--accent)}.file-image{max-width:100%;height:auto}.load-more{margin:12px}.explorer-layout .empty,.explorer-layout [role=alert]{padding:20px;font-size:12px}.explorer-layout audio{max-width:100%}
@media(max-width:850px){body:has(#explorer) main{padding:12px}.explorer-layout{grid-template-columns:minmax(170px,34%) minmax(0,1fr)}.pane-title{padding:9px 8px}.pane-title label{font-size:10px}.preview-content{padding:14px}.preview-heading{padding:12px}}
@media(max-width:500px){.explorer-layout{grid-template-columns:1fr;height:auto}.tree-pane{max-height:300px;border-right:0;border-bottom:1px solid var(--line)}.explorer-layout .preview{min-height:360px}.uri-form button{padding:6px}}

#session-progress{max-width:1080px;margin:auto}.progress-description{color:var(--muted);margin:6px 0 22px;font-size:13px}.progress-controls{display:flex;gap:10px;margin-bottom:12px}.progress-controls input{max-width:460px}.progress-controls button{white-space:nowrap}.session-list{display:flex;flex-direction:column;gap:14px}.session-card{border:1px solid var(--line);border-radius:12px;padding:22px 24px;min-width:0}.session-head{display:flex;align-items:baseline;justify-content:space-between;gap:18px;margin-bottom:10px}.session-head h2{font-size:17px;font-weight:600;margin:0;overflow-wrap:anywhere}.session-head>span{flex-shrink:0;font-size:11px}.session-state{color:var(--muted);font-size:13px;line-height:1.85;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;overflow-wrap:anywhere;margin-bottom:14px}.session-actions{display:flex;gap:10px;flex-wrap:wrap}.session-actions button{font-size:12px;padding:6px 11px}.session-overview{margin-top:20px;padding-top:20px;border-top:1px solid var(--line);overflow-wrap:anywhere}.progress-pages{display:flex;justify-content:center;align-items:center;gap:20px;margin:24px 0}.progress-pages button{font-size:12px;padding:6px 12px}#progress-error:empty{display:none}#progress-error{font-size:12px;color:var(--muted)}@media(max-width:700px){.session-head{display:block}.session-head>span{display:block;margin-top:8px}.session-card{padding:18px}.session-head h2{font-size:16px}}

.workspace-users{padding:12px 28px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:relative;z-index:10}.workspace-users summary{cursor:pointer;font-weight:600;list-style:none}.user-menu{position:absolute;top:100%;left:20px;min-width:280px;max-width:calc(100vw - 40px);max-height:60vh;overflow:auto;padding:8px;background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px #0002}.user-menu button{display:block;width:100%;text-align:left;border:0}.user-menu small{display:block;color:var(--muted)}.user-status{color:var(--muted);margin:0;font-size:12px}.user-dialog{max-width:520px;width:calc(100% - 40px);padding:24px;border:1px solid var(--line);border-radius:16px;background:var(--bg);color:var(--text)}.user-dialog::backdrop{background:#0006}.user-dialog textarea{width:100%;min-height:160px}
