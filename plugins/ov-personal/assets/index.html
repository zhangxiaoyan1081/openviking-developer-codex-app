<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenViking · 我的工作</title><style>
:root{--ink:#25382f;--muted:#78837b;--line:#e1e7df;--paper:#f7f8f3;--accent:#38654c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;background:transparent;border:1px solid var(--line);border-radius:8px;padding:9px 16px;color:inherit}button:hover{background:#e9eee5}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled{opacity:.5;cursor:default}.primary{background:var(--accent);color:white;border-color:var(--accent)}.primary:hover{background:#294f3a}.layout{display:grid;grid-template-columns:210px 1fr;min-height:100vh}aside{border-right:1px solid var(--line);padding:35px 24px;display:flex;flex-direction:column;background:#eef2e9}.brand{font-size:20px;font-weight:650;letter-spacing:-.6px}.brand small{display:block;font-size:11px;font-weight:400;letter-spacing:2px;color:var(--muted);margin:3px 0 48px}nav button{display:block;width:100%;text-align:left;border:0;margin:7px 0}nav button.active{background:#dce6d9}.side-bottom{margin-top:auto;font-size:12px;color:var(--muted)}a{color:var(--accent)}header{padding:23px 42px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}.dot{display:inline-block;width:6px;height:6px;background:#90a086;border-radius:50%;margin-right:8px}main{padding:52px 7%;max-width:1300px}h1{font-size:34px;font-weight:550;letter-spacing:-1px;line-height:1.3;margin:0 0 10px}h2{font-size:19px;margin:0 0 10px}p{margin:0 0 16px}.muted{color:var(--muted);font-size:13px}.heading{display:flex;align-items:start;justify-content:space-between;margin-bottom:38px;gap:24px}.empty{padding:50px 0}.empty h2{font-size:25px;font-weight:500}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:30px 0}.choice{text-align:left;background:white;min-height:144px;padding:24px;border:1px solid var(--line);border-radius:12px}.choice span{display:block;font-size:12px;color:var(--muted);margin-top:10px}.choice strong{font-size:17px;font-weight:550}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:26px}.card .state{min-height:60px;color:#657268;font-size:14px}.card footer{margin-top:24px;display:flex;justify-content:space-between;align-items:center;gap:12px}.tag{font-size:11px;color:var(--muted);margin-bottom:12px}.link{border:0;padding:0;color:var(--accent);text-align:left}.subtle{border:0;color:var(--muted);padding-left:0}.row{display:block;text-align:left;width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:16px 4px;overflow-wrap:anywhere}.row span{float:right;color:var(--muted)}.path{font-size:12px;overflow-wrap:anywhere;margin-bottom:18px}.toolbar{display:flex;gap:10px;margin:20px 0}.pill[aria-pressed=true]{background:#dce6d9;border-color:#b8cbb6}dialog{border:1px solid var(--line);border-radius:16px;max-width:650px;width:calc(100% - 40px);padding:30px;color:var(--ink)}dialog::backdrop{background:#1c302840;backdrop-filter:blur(3px)}.dialog-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}.dialog-head button{border:0;font-size:22px;padding:0 5px}textarea{display:block;width:100%;min-height:120px;border:1px solid var(--line);border-radius:8px;padding:14px;background:#fafbf8;color:var(--ink);resize:vertical;margin:16px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.8 ui-monospace,monospace;max-height:50vh;overflow:auto}.notice{font-size:13px;min-height:22px;color:var(--muted)}.source{display:block;margin:12px 0}.welcome-mark{color:#92a38b;font-size:48px;margin-bottom:20px}.sync-row{display:flex;justify-content:space-between;gap:20px;padding:24px 0;border-bottom:1px solid var(--line)}@media(max-width:760px){.layout{grid-template-columns:1fr}aside{padding:16px 22px;flex-direction:row;align-items:center;gap:24px;border-right:0;border-bottom:1px solid var(--line)}.brand small,.side-bottom{display:none}nav{display:flex}nav button{white-space:nowrap;padding:8px}.brand{font-size:16px}header{padding:16px 24px}main{padding:32px 24px}.choices,.cards{grid-template-columns:1fr}.heading{display:block}.heading button{margin-top:12px}h1{font-size:28px}}
</style></head><body><div class="layout"><aside><div class="brand">OpenViking<small>PERSONAL WORKSPACE</small></div><nav aria-label="主导航"><button data-page="work" class="active">我的工作</button><button data-page="files">资料</button><button data-page="sync">同步</button></nav><div class="side-bottom">带上过去，接着做。</div></aside><section><header><span>个人空间 · <button class="link" id="reload">刷新</button></span><span id="connection"><i class="dot"></i>正在连接</span></header><main id="main"></main></section></div><dialog id="dialog"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="close" aria-label="关闭">×</button></div><div id="dialog-body"></div></dialog><script>
const TOKEN='__TOKEN__',ROOT='viking://user/default/resources';let state={},page='work',uri=ROOT,readOffset=0,version=0;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,body){const r=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json','X-OV-Token':TOKEN},body:JSON.stringify(body)}:{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'请稍后重试。');return d}
function modal(title,body){$('#dialog-title').textContent=title;$('#dialog-body').innerHTML=body;if(!$('#dialog').open)$('#dialog').showModal()}
function scopeLabel(s){if(!s)return '尚未选择';return s.mode==='recent'?`最近 ${s.days} 天的全部工作`:s.mode==='skip'?'从现在开始':s.text}
function choices(){return `<div class="choices"><button class="choice" data-scope="recent"><strong>近期全部工作</strong><span>按时间带入多个项目</span></button><button class="choice" data-scope="projects"><strong>选择项目</strong><span>一个或多个项目</span></button><button class="choice" data-scope="description"><strong>描述范围</strong><span>告诉 Codex 想带入什么</span></button></div>`}
function work(){const rows=state.workspace?.works||[];$('#main').innerHTML=`<div class="heading"><div><h1>${rows.length?'接着做。':'从熟悉的工作开始。'}</h1><p class="muted">${rows.length?'已有进展，都在这里。':'带入过去的讨论和资料，不必重新讲一遍。'}</p></div>${rows.length?'<button data-action="scope">补充工作</button>':''}</div>`+(rows.length?`<div class="cards">${rows.map((w,i)=>`<article class="card"><div class="tag">${esc(w.project||'我的工作')}</div><h2>${esc(w.title)}</h2><p class="state">${esc(w.state)}</p><p>${esc(w.next)}</p><footer><button class="primary" data-continue="${i}">继续这件事</button><button class="link" data-sources="${i}">查看依据 ↗</button></footer></article>`).join('')}</div>`:state.scope&&state.scope.mode!=='skip'?`<section class="empty"><h2>已选：${esc(scopeLabel(state.scope))}</h2><p class="muted">交给 Codex 核对清单，再开始同步。</p><button class="primary" data-action="handoff">继续</button> <button class="subtle" data-action="scope">调整范围</button></section>`:`${choices()}<button class="subtle" data-action="skip">从现在开始 →</button>`)}
function syncStatus(){const i=state.imports||{};if(i.unknown)return '有 '+i.unknown+' 个会话需要核对，请回到 Codex 继续。';if(i.submitted||i.reused)return '已提交 '+(i.submitted||0)+' 个会话，复用 '+(i.reused||0)+' 个已有会话。';return state.scope?.mode==='skip'?'以后可以补充。':state.scope?'范围已保存，等待 Codex 核对。':'选择需要带入的内容。'}
function sync(){ $('#main').innerHTML=`<h1>同步</h1><p class="muted">让已有工作逐步汇合。</p><div class="sync-row"><div><h2>历史工作</h2><p>${esc(scopeLabel(state.scope))}</p><small class="muted">${esc(syncStatus())}</small></div><button data-action="scope">选择范围</button></div><div class="sync-row"><div><h2>后续对话</h2><p class="muted">由 OpenViking 官方插件记录。</p></div><button data-action="check">检查接入</button></div><div class="sync-row"><div><h2>已有上下文</h2><p class="muted">${state.workspace?.works?.length||0} 项工作</p></div><button data-action="refresh-work">更新进展</button></div>`}
async function files(){const token=++version;$('#main').innerHTML=`<h1>资料</h1><p class="path">${esc(uri)}</p><button data-action="root" class="subtle">个人资料</button><div id="files">正在读取…</div>`;try{const d=await api('/api/list?uri='+encodeURIComponent(uri));if(token!==version)return;const text=(d.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('\n');const entries=text.split('\n').map(x=>x.match(/^\[(dir|file)\] (.+)$/)).filter(Boolean);$('#files').innerHTML=entries.length?entries.map(x=>`<button class="row" data-${x[1]==='dir'?'dir':'file'}="${esc(uri+'/'+x[2].replace(/\/$/,''))}">${esc(x[2])}<span>${x[1]==='dir'?'→':'↗'}</span></button>`).join(''):`<p class="muted">${esc(text||'还没有资料。')}</p>`}catch(e){if(token===version)$('#files').textContent=e.message}}
function handoff(text,title='交给 Codex 继续'){modal(title,`<textarea id="prompt" readonly>${esc(text)}</textarea><button class="primary" id="copy">复制指令</button><p class="notice" id="notice"></p>`);$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText($('#prompt').value);$('#notice').textContent='已复制，粘贴到 Codex 即可。'}catch{$('#prompt').focus();$('#prompt').select();$('#notice').textContent='请复制已选中的指令。'}}}
function scopePrompt(){return `请使用 ov-personal，读取已保存的同步范围：${scopeLabel(state.scope)}。先展示实际可访问的历史与资料清单，核对范围后导入；复用已经在 OV 中的内容，不重复上传。然后读取相关 Session 的 Working Memory，整理我的工作进展，并更新工作台。`}
function choose(mode){if(!mode){modal('带入哪些工作？',choices());return}modal(mode==='recent'?'近期全部工作':mode==='projects'?'选择项目':'描述同步范围',`${mode==='recent'?'<div class="toolbar"><button class="pill" data-days="7" aria-pressed="false">7 天</button><button class="pill" data-days="30" aria-pressed="true">1 个月</button><button class="pill" data-days="90" aria-pressed="false">3 个月</button></div>':`<textarea id="scope-text" aria-label="同步范围" placeholder="${mode==='projects'?'输入项目名称，多个项目可换行':'例如：最近三个月的产品调研，不含客户支持'}"></textarea>`}<button id="save-scope" class="primary">继续</button><p class="notice" id="notice"></p>`);let days=30;document.querySelectorAll('[data-days]').forEach(b=>b.onclick=()=>{days=Number(b.dataset.days);document.querySelectorAll('[data-days]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});$('#save-scope').onclick=async()=>{try{state.scope=await api('/api/scope',{mode,days:mode==='recent'?days:null,text:$('#scope-text')?.value||''});work();handoff(scopePrompt())}catch(e){$('#notice').textContent=e.message}}}
async function read(file,offset=0){modal(file.split('/').pop(),'<p>正在读取…</p>');try{const d=await api('/api/read?uri='+encodeURIComponent(file)+'&offset='+offset);const text=(d.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('\n');$('#dialog-body').innerHTML=`<pre>${esc(text||'没有更多内容。')}</pre><button id="next-read">继续读取</button>`;$('#next-read').onclick=()=>read(file,offset+200)}catch(e){$('#dialog-body').textContent=e.message}}
async function go(next){version++;page=next;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(!state.connected){$('#main').innerHTML='<div class="empty"><div class="welcome-mark">↗</div><h1>连接你的 OpenViking</h1><p class="muted">把控制台的接入指令粘贴给 Codex，即可开始。</p><button data-action="check" class="primary">继续接入</button></div>';return}if(page==='files')await files();else if(page==='sync')sync();else work()}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.page)return go(d.page);if(d.scope)return choose(d.scope);if(d.dir){uri=d.dir;return files()}if(d.file)return read(d.file);if(d.continue!==undefined){const w=state.workspace.works[Number(d.continue)];return handoff(`请接着「${w.title}」做：${w.next}\n先读取 OV 中的相关来源并核对最新状态，不重复已完成工作。\n${w.sources.map(x=>x.uri).join('\n')}`)}if(d.sources!==undefined){const w=state.workspace.works[Number(d.sources)];return modal('工作依据',`<p>${esc(w.coverage||'')}</p>${w.sources.map(x=>`<button class="link source" data-file="${esc(x.uri)}">${esc(x.label)} ↗</button>`).join('')}`)}if(d.action==='scope')choose();if(d.action==='handoff')handoff(scopePrompt());if(d.action==='check')handoff('请检查 OpenViking 官方插件的火山连接、当前工具和 Hook 状态，完成尚未结束的接入步骤。');if(d.action==='refresh-work')handoff('请使用 ov-personal，读取已有工作清单及对应 Session 的最新可用 Working Memory，核对进展、决定和待办后更新工作台。');if(d.action==='root'){uri=ROOT;files()}if(d.action==='skip'){try{state.scope=await api('/api/scope',{mode:'skip'});handoff('请使用 ov-personal，从现在开始记录我的工作。先问我今天想做什么，不导入旧历史。')}catch(e){modal('暂时无法保存',esc(e.message))}}});$('#close').onclick=()=>$('#dialog').close();
$('#reload').onclick=()=>init();
async function init(){try{state=await api('/api/state');$('#connection').innerHTML='<i class="dot"></i>'+ (state.connected?'火山 OpenViking':'待接入');await go(page)}catch(e){$('#main').textContent=e.message}}init();
</script></body></html>
