<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenViking</title><style>
:root{color-scheme:light dark;--bg:var(--color-background-primary,light-dark(#fff,#202321));--soft:var(--color-background-secondary,light-dark(#f6f8f6,#2a302c));--text:var(--color-text-primary,light-dark(#20352b,#edf4ef));--muted:var(--color-text-secondary,light-dark(#69796f,#a9b9ae));--line:var(--color-border-primary,light-dark(#e1e7e2,#415045));--accent:light-dark(#306647,#92c7a0)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 14px}button:hover{background:var(--soft)}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}.primary:hover{filter:brightness(.9);background:var(--accent)}.quiet{border:0;color:var(--muted)}.brand{font-weight:650;letter-spacing:-.4px}.brand img{width:25px;height:25px;vertical-align:middle;margin-right:8px}header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--line);gap:12px}header small{color:var(--muted);font-weight:400;margin-left:10px}main{padding:24px;max-width:1300px;margin:auto}h1{font-size:24px;font-weight:600;letter-spacing:-.6px;line-height:1.35;margin:0 0 10px}h2{font-size:17px;margin:0 0 8px}p{margin:0 0 12px}.muted{color:var(--muted);font-size:12px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0 14px}.choice{text-align:left;padding:18px 14px;min-height:90px}.choice strong,.choice span{display:block}.choice span{font-size:12px;color:var(--muted);margin-top:6px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.spaced{justify-content:space-between}.stack{display:grid;gap:12px}.card{border:1px solid var(--line);padding:20px;border-radius:12px;overflow-wrap:anywhere}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:14px}.card footer{display:flex;gap:10px;margin-top:16px;align-items:center}.tag{font-size:11px;color:var(--accent);margin-bottom:8px}.empty{padding:28px 0;color:var(--muted)}.tabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}.tabs button{border:0;color:var(--muted)}.tabs button.active,button[aria-pressed=true]{background:var(--soft);color:var(--accent)}input,textarea,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}textarea{resize:vertical;min-height:90px}label{display:block;margin:16px 0 8px}.field{max-width:600px;margin:22px 0}.actions{display:flex;gap:10px;margin-top:20px}#notice{padding:0 24px 16px;color:var(--muted);font-size:12px;min-height:24px;overflow-wrap:anywhere}.review{max-height:300px;overflow:auto;margin:18px 0;border-block:1px solid var(--line)}.review article{padding:12px 0;border-bottom:1px solid var(--line)}.directory{display:grid;grid-template-columns:minmax(190px,35%) minmax(0,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:350px}.listing{background:var(--soft);border-right:1px solid var(--line);padding:12px;max-height:65vh;overflow:auto}.entry{display:block;text-align:left;width:100%;border:0;background:transparent;border-radius:6px;padding:10px;overflow-wrap:anywhere}.preview{padding:20px;min-width:0;max-height:65vh;overflow:auto}.preview pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.8 ui-monospace,monospace}.path{display:flex;flex-wrap:wrap;gap:3px;margin:12px 0;overflow-wrap:anywhere}.path button{border:0;padding:4px 6px;font-size:12px}.report-body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.85}.source{display:block;color:var(--accent);text-align:left;border:0;padding:5px 0;font-size:12px}.report-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:440px;margin:12px 0 20px}.pill{font-size:11px;color:var(--accent)}@media(max-width:500px){header{padding:14px 16px}main{padding:20px 16px}.choices{grid-template-columns:1fr}.choice{min-height:0;padding:12px 14px}.choice span{margin-top:2px}.directory{grid-template-columns:1fr}.listing{border-right:0;border-bottom:1px solid var(--line);max-height:230px}.report-controls{grid-template-columns:1fr}header small{display:none}}

body:has(#explorer) main{max-width:none;padding:16px 20px}body:has(#explorer) .tabs{margin-bottom:12px}
.explorer-toolbar{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:10px}.explorer-toolbar>button{padding:6px;display:flex}.explorer-toolbar .path{flex:1;margin:0}.uri-form{display:flex;gap:8px;margin:10px 0}.uri-form button{flex-shrink:0;white-space:nowrap;padding:5px 12px}.uri-form input{min-width:0;font:12px ui-monospace,monospace;padding:7px 10px}
.explorer-layout{display:grid;grid-template-columns:minmax(220px,28%) minmax(0,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden;height:calc(100dvh - 255px);min-height:400px}.tree-pane{min-width:0;overflow:auto;border-right:1px solid var(--line);background:var(--bg)}.pane-title{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);position:sticky;top:0;background:var(--bg);z-index:1}.pane-title label{display:flex;align-items:center;gap:4px;margin:0;font-size:11px}.pane-title input{width:auto;margin:0}#tree{padding:8px 0}.tree-row{display:flex;align-items:center;min-height:32px;min-width:0;padding-right:6px}.tree-row:hover{background:var(--soft)}.tree-toggle{display:flex;align-items:center;justify-content:center;border:0;background:transparent;border-radius:4px;padding:2px;flex:none;width:22px;height:26px;color:var(--muted)}.tree-spacer{flex:none;width:22px}.tree-entry{display:flex;align-items:center;gap:7px;min-width:0;flex:1;border:0;background:transparent;text-align:left;padding:4px 0;border-radius:0;font-size:12px;white-space:nowrap}.tree-entry:hover{background:transparent}.tree-entry svg{flex:none;color:var(--muted)}.tree-entry span{overflow:hidden;text-overflow:ellipsis}.selected{background:color-mix(in srgb,var(--accent) 10%,var(--bg))!important;color:var(--accent)}.tree-status{padding:5px 16px 5px 38px;color:var(--muted);font-size:11px;overflow-wrap:anywhere}
.explorer-layout .preview{padding:0;min-width:0;max-height:none;overflow:auto}.preview-heading{padding:14px 18px;border-bottom:1px solid var(--line)}.preview-heading h2{display:flex;align-items:center;gap:8px;font-size:14px;margin:0;overflow-wrap:anywhere}.preview-heading svg{flex:none;color:var(--muted)}.preview-tabs{display:flex;gap:4px;padding:0 14px;border-bottom:1px solid var(--line)}.preview-tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;font-size:12px;padding:9px 10px;color:var(--muted)}.preview-tabs button[aria-selected=true]{border-bottom-color:var(--accent);color:var(--text)}.level-tabs{gap:14px}.level-tabs button{font-size:13px}.level-tabs span{font:10px ui-monospace,monospace;margin-left:5px;color:var(--muted);background:var(--soft);padding:2px 4px;border-radius:3px}.view-tabs{padding-top:5px;padding-bottom:5px;gap:4px;background:var(--soft)}.view-tabs button{padding:3px 10px;border:0;border-radius:5px}.view-tabs button[aria-selected=true]{background:var(--bg);box-shadow:0 1px 2px #0001}.preview-content{padding:20px}.preview-content pre{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.75 ui-monospace,monospace}.path-view{display:grid;gap:16px;justify-items:start}.path-view code{overflow-wrap:anywhere;font-size:12px}.path-view button{font-size:12px;padding:5px 10px}
.markdown-body{font-size:13px;line-height:1.85;overflow-wrap:anywhere}.markdown-body h1{font-size:23px}.markdown-body h2{font-size:19px;margin:20px 0 10px}.markdown-body h3{font-size:16px}.markdown-body table{border-collapse:collapse;display:block;overflow:auto}.markdown-body td,.markdown-body th{border:1px solid var(--line);padding:5px 9px}.markdown-body pre{padding:12px;background:var(--soft);border-radius:6px;overflow:auto}.markdown-body code{font-size:12px}.markdown-body blockquote{border-left:3px solid var(--accent);padding-left:12px;margin-left:0;color:var(--muted)}.markdown-body a{color:var(--accent)}.file-image{max-width:100%;height:auto}.load-more{margin:12px}.explorer-layout .empty,.explorer-layout [role=alert]{padding:20px;font-size:12px}.explorer-layout audio{max-width:100%}
@media(max-width:850px){body:has(#explorer) main{padding:12px}.explorer-layout{grid-template-columns:minmax(170px,34%) minmax(0,1fr)}.pane-title{padding:9px 8px}.pane-title label{font-size:10px}.preview-content{padding:14px}.preview-heading{padding:12px}}
@media(max-width:500px){.explorer-layout{grid-template-columns:1fr;height:auto}.tree-pane{max-height:300px;border-right:0;border-bottom:1px solid var(--line)}.explorer-layout .preview{min-height:360px}.uri-form button{padding:6px}}
</style></head><body><header><div class="brand"><img src="__OPENVIKING_LOGO__" alt="" width="25" height="25">OpenViking<small>个人空间</small></div><div id="header-actions"></div></header><main id="main"><p class="muted">正在加载…</p></main><div id="notice" role="status" aria-live="polite"></div><script>/* APP */</script></body></html>
